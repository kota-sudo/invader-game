<!DOCTYPE html>
<!-- 開発用エントリ: このファイルから main.js を読み込む。配布・本番確認は `npm run build` → dist/（README 参照）。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self';">
  <title>INVADER CORE — GALAXY WAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=118">
  <link rel="stylesheet" href="css/stage-select.css?v=118">
  <link rel="stylesheet" href="css/galaxy-map.css?v=118">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
  <div id="rotate-hint" role="status" aria-live="polite">
    <div style="font-size:2.5em" aria-hidden="true">📱</div>
    <div lang="ja">横向きにしてください</div>
    <div lang="en" style="font-size:0.7em;opacity:0.5;margin-top:6px">Please rotate your device</div>
  </div>
  <div id="game-container">
    <div id="hud">
      <span>STAGE <span id="stage">1</span></span>
      <span>HP <span id="lives">100/100</span></span>
      <span>FUEL <span id="fuel">10/10</span> <span id="fuel-next" style="font-size:0.8em;opacity:0.65;"></span></span>
      <span>● <span id="coins">0</span></span>
      <span>💎 <span id="gems">0</span></span>
    </div>
    <div class="canvas-wrap">
    <canvas id="canvas" width="800" height="600" role="img" aria-label="INVADER CORE ゲーム画面"></canvas>
    <div id="galaxy-map-overlay" aria-hidden="true"></div>
    <div id="stage-select-overlay" aria-hidden="true"></div>
    </div>
    <div id="message" class="hidden" role="alert" aria-live="assertive"></div>
    <!-- Shop hex tree panel (HTML overlay — replaces canvas panel) -->
    <div id="shop-panel">
      <div id="sp-hdr">
        <div id="sp-icon"></div>
        <div id="sp-name">NODE</div>
        <span id="sp-tag">T1</span>
      </div>
      <div id="sp-lvrow"><div id="sp-lvdots"></div><div id="sp-lvtext">Lv 0/10</div></div>
      <div id="sp-effect"></div>
      <div id="sp-req"></div>
      <div id="sp-costrow"></div>
      <div id="sp-btnrow"><button id="sp-btn" class="off">-</button></div>
    </div>
  </div>
  <!-- 開発: ES modules のまま main.js を読む。ビルド後の単一バンドルは dist/index.html が参照する。 -->
  <script type="module" src="main.js?v=123"></script>
</body>
</html>
